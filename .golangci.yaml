version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - funlen
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - lll
    - loggercheck
    - makezero
    - misspell
    - mnd
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - staticcheck
    - tagliatelle
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    funlen:
      ignore-comments: true
    gomoddirectives:
      # Modules in this repo replace each other with their sibling directories on purpose.
      replace-local: true
    gocritic:
      disabled-checks:
        - exitAfterDefer
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 10
    govet:
      disable:
        - fieldalignment
        - printf
    lll:
      line-length: 150
    misspell:
      locale: US
    nakedret:
      max-func-lines: 1
    tagliatelle:
      case:
        rules:
          avro: snake
          bson: camel
          json: snake
          mapstructure: kebab
          xml: camel
          yaml: snake
  exclusions:
    generated: lax
    presets:
      # Doc comments are optional here, exported identifiers included (house convention).
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - forcetypeassert
          - funlen
          - lll
        path: _test\.go
      # Random test-data generators (Pick, RandomEmail, ...) do not need crypto/rand.
      - linters:
          - gosec
        path: util/util\.go
        text: G404
      # Example programs are illustrative snippets: they discard results and use literal values on purpose.
      - linters:
          - errcheck
          - mnd
          - unused
        path: /example/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
