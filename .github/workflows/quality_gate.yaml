name: Quality Gate Workflow

on: workflow_call

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
    - name: Fetch code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.work'
        cache-dependency-path: '**/go.sum'

    - name: Run linter
      run: make lint

  vuln-check:
    name: Vuln Check
    runs-on: ubuntu-22.04
    steps:
    - name: Fetch code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.work'
        cache-dependency-path: '**/go.sum'

    - name: Run vulnerability checks
      run: make vuln-check

  unit_test:
    name: Unit Test
    runs-on: ubuntu-22.04
    steps:
    - name: Fetch code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.work'
        cache-dependency-path: '**/go.sum'

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: make test.unit
